run:
  name: cifar10_smallcnn_smoke
  out_dir: outputs/cifar
  seeds: [0]
  device: auto

data:
  root: data
  dataset: CIFAR10
  download: true
  num_workers: 2
  subset_train: 5000
  subset_test: 1000

model:
  name: SmallCNN
  num_classes: 10

train:
  rounds: 200
  eval_every: 20

oracle:
  delta: 0.01
  smooth_B: 2
  data_B: 128

  eval_smooth_B: 4
  eval_data_B: 128

nog:
  M: 8
  eta: 0.05

ssgd:
  lr: 0.01

metrics:
  thresholds: [2.0, 1.5, 1.0, 0.7, 0.5]
  eval_train_batches: 10
  eval_test_batches: 20
  eval_current_x: false

methods:
  - NOG
  - SmoothedSGD

wandb:
  enabled: false
