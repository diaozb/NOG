run:
  name: nog_optimism_ablation_v4
  out_dir: outputs/distributed_cpu_fo_nog_optimism_ablation_v4
  device: cpu
  formal_seeds: [620, 621, 622, 623, 624, 625, 626, 627, 628, 629, 630, 631, 632, 633, 634, 635, 636, 637, 638, 639]

problem:
  name: SyntheticMaxSinL1
  d: 100
  n_data: 4096
  R: 1
  lam: 0.001
  feature_scale: 1.0
  common_feature_bias: 0.25
  phase_mode: zero

train:
  rounds: 960
  eval_every: 24
  strict_eval_grid: true

oracle:
  delta: 0.1
  smooth_B: 1
  data_B_total: 8
  eval_smooth_B: 256
  eval_data_B: 512
  evaluation_seed_mode: fixed_bank

nog:
  M: 2
  eta: 1.0

distributed:
  execution: cpu_process
  backend: gloo
  topology: complete
  comparison_worker: 8
  scaling_workers: [8]
  split_mode: total_batch_fixed
  shuffle_partitions: true
  rng_mode: rank_schedule

methods:
  sfo: [NOG-FO, NOG-FO-NONOPT]
  szo: []

cpu_process:
  threads_per_rank: 1
  process_group_timeout_seconds: 120
  launch_timeout_seconds: 600
  max_total_worker_processes: 32
  task_timeout_seconds: 129600

ablation:
  name: optimistic_vs_nonoptimistic
  pilot_seeds: [600, 601, 602, 603, 604]
  formal_seeds: [620, 621, 622, 623, 624, 625, 626, 627, 628, 629, 630, 631, 632, 633, 634, 635, 636, 637, 638, 639]
  worker_count: 8
  same_problem_partition_and_oracle_streams: true
  same_initialization_oracle_count: true
  fixed_parameters:
    M: 2
    eta: 1.0
    smooth_B: 1
    data_B_total: 8

wandb:
  enabled: false
