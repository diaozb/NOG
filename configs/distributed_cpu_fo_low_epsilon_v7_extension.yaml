run:
  name: epsilon_low_extension_v7_theory_scaling_extension
  out_dir: outputs/distributed_cpu_fo_v7
  device: cpu
  formal_seeds: [70, 71, 72, 73, 74, 75, 76, 77, 78, 79, 80, 81, 82, 83, 84, 85, 86, 87, 88, 89]

problem:
  name: SyntheticMaxSinL1
  d: 100
  n_data: 4096
  R: 1
  lam: 0.001
  feature_scale: 1.0
  common_feature_bias: 0.25
  phase_mode: zero

train:
  rounds: 15360
  eval_every: 2
  strict_eval_grid: false

oracle:
  delta: 0.1
  smooth_B: 1
  data_B_total: 16
  eval_smooth_B: 256
  eval_data_B: 512
  evaluation_seed_mode: fixed_bank

nog:
  M: 2
  eta: 1.0

me_dol:
  epoch_length: 6
  theory_multiplier: 100.0

distributed:
  execution: cpu_process
  backend: gloo
  topology: complete
  comparison_worker: 8
  scaling_workers: [8]
  split_mode: total_batch_fixed
  shuffle_partitions: true
  rng_mode: rank_schedule

methods:
  sfo: [NOG-FO, ME-DOL-FO]
  szo: []

cpu_process:
  threads_per_rank: 1
  process_group_timeout_seconds: 120
  launch_timeout_seconds: 129600
  max_total_worker_processes: 32
  task_timeout_seconds: 129600

theory_scaling:
  # Dense thresholds are evaluated from a small number of piecewise-theoretical
  # trajectories. Formal results never influence parameters or segment choices.
  epsilons: [0.01000, 0.00975, 0.00950, 0.00925, 0.00900, 0.00875, 0.00850, 0.00825, 0.00800, 0.00775, 0.00750, 0.00725, 0.00700, 0.00675, 0.00650, 0.00625, 0.00600, 0.00575, 0.00550, 0.00525, 0.00500, 0.00475, 0.00450, 0.00425, 0.00400]
  confirmed_hit_consecutive: 2
  pilot_seeds: [310, 311, 312, 313, 314]
  reference_worker: 8
  max_parallel_tasks: 4
  pilot_max_depth: 30720
  formal_max_depth: 61440

  # The exponents come from NOG Theorem 4.1/4.3:
  # M ~ epsilon^(-2/3), eta ~ epsilon^(1/3), B ~ epsilon^(-4/3).
  # Stage-2 boundary expansion after stage 1 failed strict full coverage. Only one
  # global eta multiplier is calibrated on pilot seeds; no formal results are used.
  nog_eta_scale_candidates: [2.5, 3.0, 4.0]
  nog_segments:
    - {id: n0, epsilon_max: 0.01000, epsilon_min: 0.00925, representative_epsilon: 0.01000, M: 2, eta: 1.00, batch_total: 16}
    - {id: n1, epsilon_max: 0.00900, epsilon_min: 0.00800, representative_epsilon: 0.00850, M: 2, eta: 0.95, batch_total: 24}
    - {id: n2, epsilon_max: 0.00775, epsilon_min: 0.00675, representative_epsilon: 0.00725, M: 3, eta: 0.90, batch_total: 24}
    - {id: n3, epsilon_max: 0.00650, epsilon_min: 0.00550, representative_epsilon: 0.00600, M: 3, eta: 0.85, batch_total: 32}
    - {id: n4, epsilon_max: 0.00525, epsilon_min: 0.00450, representative_epsilon: 0.00500, M: 3, eta: 0.80, batch_total: 40}
    - {id: n5, epsilon_max: 0.00425, epsilon_min: 0.00400, representative_epsilon: 0.00400, M: 4, eta: 0.75, batch_total: 56}

  # ME-DOL Theorem 1/2 gives N ~ epsilon^-3 and epoch length
  # T ~ (delta N)^(2/3) ~ epsilon^-2. Its domain multiplier is an
  # epsilon-independent constant; stage 2 extends toward smaller values.
  me_multiplier_candidates: [6.25, 12.5, 25.0, 37.5]
  me_segments:
    - {id: m0, epsilon_max: 0.01000, epsilon_min: 0.00925, representative_epsilon: 0.01000, epoch_length: 6, batch_total: 8}
    - {id: m1, epsilon_max: 0.00900, epsilon_min: 0.00800, representative_epsilon: 0.00850, epoch_length: 8, batch_total: 8}
    - {id: m2, epsilon_max: 0.00775, epsilon_min: 0.00675, representative_epsilon: 0.00725, epoch_length: 12, batch_total: 8}
    - {id: m3, epsilon_max: 0.00650, epsilon_min: 0.00550, representative_epsilon: 0.00600, epoch_length: 16, batch_total: 8}
    - {id: m4, epsilon_max: 0.00525, epsilon_min: 0.00450, representative_epsilon: 0.00500, epoch_length: 24, batch_total: 8}
    - {id: m5, epsilon_max: 0.00425, epsilon_min: 0.00400, representative_epsilon: 0.00400, epoch_length: 40, batch_total: 8}

  calibration:
    require_hits_per_anchor: 5
    objective: minimum_geometric_mean_first_hit_work_after_full_anchor_coverage

wandb:
  enabled: false
