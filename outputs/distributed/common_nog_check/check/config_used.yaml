run:
  name: common_nog_check
  out_dir: outputs/distributed
  device: auto
  formal_seeds:
  - 0
  - 1
  - 2
  - 3
  - 4
  pilot_seeds:
  - 100
  - 101
  device_used: cuda
  stage: check
problem:
  name: SyntheticMaxSinL1
  d: 100
  n_data: 4096
  R: 4
  lam: 0.001
train:
  rounds: 12
  eval_every: 48
oracle:
  delta: 0.1
  smooth_B: 8
  data_B_total: 64
  eval_smooth_B: 64
  eval_data_B: 128
nog:
  M: 12
  eta: 0.3
distributed:
  execution: single_process_simulation
  topology: complete
  comparison_worker: 8
  scaling_workers:
  - 1
  - 2
  - 4
  - 8
  split_mode: total_batch_fixed
  shuffle_partitions: true
methods:
  sfo:
  - NOG-FO
  - ME-DOL-FO
  szo:
  - NOG-ZO
  - ME-DOL-ZO
  - DGFM
  - DGFM+
pilot:
  selection_metric: final_stat_proxy_at_fixed_work
  me_dol:
    theory_multiplier:
    - 0.3
    - 1.0
    - 3.0
  dgfm:
    eta:
    - 0.001
    - 0.003
    - 0.01
    - 0.03
  dgfm_plus:
    eta:
    - 0.001
    - 0.003
    - 0.01
    small_batch:
    - 8
    - 16
    large_batch:
    - 64
    - 128
    restart_period:
    - 24
    - 48
    restart_mixing_rounds:
    - 1
    - 3
metrics:
  thresholds:
  - 0.01
  - 0.009
  - 0.008
  - 0.0075
  error_band: standard_deviation
  primary_metric: stat_proxy
  primary_x_axis: communication_round
work_accounting:
  sfo_sample_cost: 1
  szo_two_point_sample_cost: 2
  training_and_evaluation_separate: true
  dgfm_plus_restart_mixing_counted: true
wandb:
  enabled: true
  project: nog-distributed-baselines
  entity: ''
  mode: online
  tags:
  - distributed
  - synthetic
  - baselines
  - d100
  - single-process-simulation
