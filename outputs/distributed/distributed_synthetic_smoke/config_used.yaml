run:
  name: distributed_synthetic_smoke
  out_dir: outputs/distributed
  seeds:
  - 0
  device: auto
  device_used: cuda
problem:
  d: 100
  n_data: 4096
  R: 4
  lam: 0.001
train:
  rounds: 240
  eval_every: 48
oracle:
  delta: 0.1
  smooth_B: 8
  data_B_total: 64
  eval_smooth_B: 64
  eval_data_B: 128
nog:
  M: 12
  eta: 0.3
distributed:
  workers:
  - 1
  - 2
  - 4
  - 8
  split_mode: total_batch_fixed
  shuffle_partitions: true
metrics:
  thresholds:
  - 0.01
  - 0.009
  - 0.008
  - 0.0075
work_accounting:
  communication_round_column: communication_round
  total_work_column: total_work
  per_worker_work_column: per_worker_work
  evaluation_work_column: eval_work
